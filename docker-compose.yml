version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nit-help-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nit_help
    ports:
      - "5432:5432"
    volumes:
      - nit_pg_data:/var/lib/postgresql/data

volumes:
  nit_pg_data:

