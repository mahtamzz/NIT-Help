services:
  postgres:
    image: postgres:16-alpine
    container_name: nit-help-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nit_help
    ports:
      - "5432:5432"
    volumes:
      - nit_pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nit_help"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nit-help-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - nit_rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  iam-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_DIR: apps/iam-service
    container_name: nit-help-iam-service
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      IAM_PORT: 4001
      IAM_TCP_PORT: 4101
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/nit_help?schema=iam
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CORE_TCP_HOST: core-service
      CORE_TCP_PORT: 4102
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-nit_help_jwt_access_super_secret_key_2026_secure!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-nit_help_jwt_refresh_super_secret_key_2026_secure!}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-nit_help_gateway_internal_secret_2026!}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "4001:4001"
      - "4101:4101"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  core-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_DIR: apps/core-service
    container_name: nit-help-core-service
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CORE_PORT: 4002
      CORE_TCP_PORT: 4102
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/nit_help?schema=core
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      IAM_TCP_HOST: iam-service
      IAM_TCP_PORT: 4101
      MEDIA_TCP_HOST: media-service
      MEDIA_TCP_PORT: 4103
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-nit_help_jwt_access_super_secret_key_2026_secure!}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-nit_help_gateway_internal_secret_2026!}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "4002:4002"
      - "4102:4102"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  media-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_DIR: apps/media-service
    container_name: nit-help-media-service
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MEDIA_PORT: 4003
      MEDIA_TCP_PORT: 4103
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/nit_help?schema=media
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CORE_TCP_HOST: core-service
      CORE_TCP_PORT: 4102
      UPLOAD_DIR: /app/apps/media-service/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-nit_help_jwt_access_super_secret_key_2026_secure!}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-nit_help_gateway_internal_secret_2026!}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "4003:4003"
      - "4103:4103"
    volumes:
      - nit_media_uploads:/app/apps/media-service/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications-ops-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_DIR: apps/notifications-ops-service
    container_name: nit-help-notifications-ops-service
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      OPS_PORT: 4004
      OPS_TCP_PORT: 4104
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/nit_help?schema=ops
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      IAM_TCP_HOST: iam-service
      IAM_TCP_PORT: 4101
      CORE_TCP_HOST: core-service
      CORE_TCP_PORT: 4102
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-nit_help_jwt_access_super_secret_key_2026_secure!}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-nit_help_gateway_internal_secret_2026!}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "4004:4004"
      - "4104:4104"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: nit-help-nginx-gateway
    restart: always
    environment:
      IAM_UPSTREAM: iam-service:4001
      CORE_UPSTREAM: core-service:4002
      MEDIA_UPSTREAM: media-service:4003
      OPS_UPSTREAM: notifications-ops-service:4004
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-nit_help_gateway_internal_secret_2026!}
    ports:
      - "4000:4000"
    depends_on:
      - iam-service
      - core-service
      - media-service
      - notifications-ops-service

volumes:
  nit_pg_data:
  nit_rmq_data:
  nit_media_uploads:
